name: Deploy to GitHub Pages

# Publishes the contents of ./site to GitHub Pages (manual trigger only).
# Pages is currently served via "Deploy from a branch" (main, / root): the root
# index.html redirects to ./site/. To use this workflow instead, set
# Settings -> Pages -> Source to "GitHub Actions" and re-add the push trigger.
# NOTE: run `npm run build` locally and commit site/data.json + site/photos/
# before pushing — this workflow only deploys the already-generated static files.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
